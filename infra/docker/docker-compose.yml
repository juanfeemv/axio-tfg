version: '3.8'

services:
  # --- 1. BASE DE DATOS ---
  mongo:
    image: mongo:latest
    container_name: axio_mongo
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - axio-net

  # Visor de Base de Datos
  mongo-express:
    image: mongo-express
    container_name: axio_admin
    restart: always
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
    depends_on:
      - mongo
    networks:
      - axio-net

  # Caché Redis
  redis:
    image: redis:alpine
    container_name: axio_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - axio-net

  # --- 2. BACKEND (API) ---
  backend:
    build: ../../server
    container_name: axio_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/axio_db
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_WEBHOOK_URL_RESET=${N8N_WEBHOOK_URL_RESET}
      - N8N_WEBHOOK_URL_COMMENT=${N8N_WEBHOOK_URL_COMMENT}
      - N8N_WEBHOOK_URL_DISCORD=${N8N_WEBHOOK_URL_DISCORD}
      # En producción con túnel, añade los orígenes permitidos:
      # - ALLOWED_ORIGINS=https://tu-dominio.com,http://localhost:5173
    depends_on:
      - mongo
    volumes:
      # Volumen para uploads: las imágenes/capturas se guardan aquí
      # Monta la carpeta local server/uploads dentro del contenedor
      # Si migras de desarrollo local a Docker, copia tus archivos previos aquí
      - ../../server/uploads:/app/uploads
    networks:
      - axio-net

  # --- 3. FRONTEND (WEB) ---
  frontend:
    build: ../../client
    container_name: axio_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - axio-net

  # --- 4. AUTOMATIZACIÓN (n8n) ---
  n8n:
    image: n8nio/n8n
    container_name: axio_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=axio_automation
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - axio-net

  # --- 5. TÚNEL CLOUDFLARE (Acceso público sin abrir puertos) ---
  # Servicio OPCIONAL. Para usarlo, ejecuta: docker compose --profile tunnel up
  #
  # REQUISITOS PREVIOS en tu PC (no en la Raspberry Pi):
  #   1. Instalar cloudflared: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/get-started/
  #   2. cloudflared tunnel login
  #   3. cloudflared tunnel create axio-tfg
  #   4. cloudflared tunnel route dns axio-tfg tudominio.com
  #   5. Copiar el Token del túnel desde ~/.cloudflared/<tunnel-id>.json
  #      a la variable CLOUDFLARE_TUNNEL_TOKEN en el archivo .env
  #
  # Una vez configurado, la Raspberry Pi expone Axio a Internet automáticamente
  # sin abrir puertos del router, sin IP pública y con certificado SSL de Cloudflare.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: axio_tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks:
      - axio-net
    profiles:
      - tunnel

  # --- 6. QUICK TUNNEL (URL temporal de trycloudflare.com, sin configuración) ---
  # Servicio TEMPORAL para pruebas. Ejecuta: docker compose --profile quick-tunnel up
  # NO necesita token, dominio ni configuración previa.
  # La URL pública (tipo https://xxx.trycloudflare.com) aparece en los logs.
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: axio_tunnel_quick
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    networks:
      - axio-net
    profiles:
      - quick-tunnel

volumes:
  mongo_data:
  n8n_data:

networks:
  axio-net:
    driver: bridge